# Copy this file to config.toml and fill in plex_token.

# Where Plex is. Leave as-is when Jukebox runs on the same machine as Plex.
plex_url = "http://127.0.0.1:32400"

# The server owner's Plex token (see README: "Finding your Plex token").
plex_token = ""

# Address and port for the web app. 0.0.0.0 = reachable from other devices on your network.
host = "0.0.0.0"
port = 8765

# The address people use to reach Jukebox, e.g. "http://192.168.1.20:8765" or
# "https://jukebox.example.com". Needed for Plex sign-in when Jukebox is behind a
# reverse proxy; otherwise it's worked out from the address in the browser.
public_url = ""

# Each shared playlist shows up in every member's Plex as  <prefix><name>.
playlist_prefix = "👥 "

# How often (seconds) to check everyone's Plex copies for edits made in Plex/Plexamp.
poll_seconds = 20

# true:  adding/removing songs inside Plex or Plexamp counts as an edit for everyone.
# false: only the web app edits; changes made inside Plex get undone on the next check.
pull_from_plex = true

# Leave empty to let everyone you share the server with join in, or list usernames/emails.
# The server owner is always included.
allowed_users = []
